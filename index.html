<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plataforma Longaví</title>
<style>
/* ===== Tokens del sistema de diseño (H14.1) ===== */
:root{
  --tostado:#4A2512;   /* 1 · texto, encabezados, navegación */
  --caramelo:#8A5226;  /* 2 · acción primaria, enlaces, foco */
  --arena:#D9C4A3;     /* 3 · bordes, separadores, cabeceras de tabla */
  --crema:#FAF5EC;     /* 4 · fondo de página */
  --blanco:#FFFFFF;    /* 5 · superficies (tarjetas, campos) */
  /* Colores de estado (funcionales, no de marca) */
  --apto:#3B6527; --bloq:#A3261B; --rev:#8A5A00;
  --f-tit: Georgia, "Times New Roman", serif;
  --f-ui: Verdana, Geneva, "DejaVu Sans", sans-serif;
  --s1:4px; --s2:8px; --s3:16px; --s4:24px; --s5:32px; --s6:48px;
  --radio:6px; --tactil:44px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--crema);color:var(--tostado);font-family:var(--f-ui);font-size:15px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--f-tit);font-weight:700;line-height:1.25;margin:0 0 var(--s2)}
h1{font-size:28px} h2{font-size:22px} h3{font-size:18px} h4{font-size:16px}
p{margin:0 0 var(--s3)}
a{color:var(--caramelo)}
:focus-visible{outline:3px solid var(--caramelo);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:absolute;left:-999px;top:0;background:var(--tostado);color:#fff;padding:12px 16px;z-index:99}
.skip:focus{left:8px}

/* ===== Estructura ===== */
.demo-bar{background:var(--tostado);color:#fff;font-size:13px;padding:6px var(--s3);display:flex;gap:var(--s3);align-items:center;justify-content:space-between;flex-wrap:wrap}
.demo-bar label{display:flex;gap:8px;align-items:center;cursor:pointer;min-height:32px}
.demo-bar input{width:20px;height:20px;accent-color:var(--caramelo)}
header.top{background:var(--blanco);border-bottom:1px solid var(--arena);display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);position:sticky;top:0;z-index:20}
header.top img{height:52px;width:auto}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--f-tit);font-size:18px}
.brand span{font-size:12px}
.top .spacer{flex:1}
.user{display:flex;align-items:center;gap:var(--s2);font-size:13px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--arena);display:grid;place-items:center;font-weight:700}
.btn.menu-btn{display:none}
.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 110px)}
nav.side{background:var(--blanco);border-right:1px solid var(--arena);padding:var(--s3) var(--s2);overflow:auto}
nav.side h2{font-size:12px;font-family:var(--f-ui);text-transform:uppercase;letter-spacing:.06em;margin:var(--s3) var(--s2) var(--s1)}
nav.side a{display:flex;align-items:center;gap:10px;min-height:var(--tactil);padding:8px 12px;border-radius:var(--radio);color:var(--tostado);text-decoration:none;font-size:14px}
nav.side a:hover{background:var(--crema)}
nav.side a[aria-current="page"]{background:var(--tostado);color:#fff}
nav.side a .tag{margin-left:auto}
nav.side svg{flex:none}
main{padding:var(--s4) var(--s5);max-width:1240px;width:100%}
.crumbs{font-size:13px;margin-bottom:var(--s3)}
.crumbs ol{list-style:none;display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:0}
.crumbs li+li:before{content:"›";margin-right:6px}
.crumbs a{text-decoration:none}
.lead{font-size:16px;max-width:820px}

/* ===== Componentes ===== */
.btn{font-family:var(--f-ui);font-size:15px;min-height:var(--tactil);padding:10px 18px;border-radius:var(--radio);border:2px solid var(--caramelo);background:var(--caramelo);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:700;text-decoration:none;transition:background .15s,transform .05s}
.btn:hover{background:var(--tostado);border-color:var(--tostado)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--blanco);color:var(--caramelo)}
.btn.sec:hover{background:var(--crema);color:var(--tostado);border-color:var(--tostado)}
.btn.ter{background:transparent;border-color:transparent;color:var(--caramelo);text-decoration:underline}
.btn.ter:hover{background:var(--crema)}
.btn.peligro{background:var(--bloq);border-color:var(--bloq)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--blanco);border:1px solid var(--arena);border-radius:8px;padding:var(--s4);margin-bottom:var(--s4)}
.grid{display:grid;gap:var(--s3)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap;background:var(--blanco)}
.chip.apto{color:var(--apto)} .chip.bloq{color:var(--bloq)} .chip.rev{color:var(--rev)} .chip.neu{color:var(--tostado)}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--arena);color:var(--tostado);text-transform:uppercase;letter-spacing:.04em}
.tag.ok{background:var(--apto);color:#fff}
.alert{display:flex;gap:12px;padding:14px 16px;border-radius:var(--radio);border-left:6px solid;background:var(--blanco);margin-bottom:var(--s3)}
.alert.ok{border-color:var(--apto)} .alert.err{border-color:var(--bloq)} .alert.warn{border-color:var(--rev)} .alert.info{border-color:var(--caramelo)}
.alert b{display:block}
table{border-collapse:collapse;width:100%;background:var(--blanco);font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--arena);text-align:left;vertical-align:middle}
th{background:var(--crema);font-weight:700;border-bottom:2px solid var(--arena)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.sel{background:#F3E9D8}
td label .demo,td b .demo,td>b{white-space:nowrap}
.table-wrap{overflow-x:auto;border:1px solid var(--arena);border-radius:8px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--s3)}
.field label{font-weight:700;font-size:14px}
.field input,.field select{font-family:var(--f-ui);font-size:15px;min-height:var(--tactil);padding:8px 12px;border:2px solid var(--arena);border-radius:var(--radio);background:var(--blanco);color:var(--tostado)}
.field input:focus,.field select:focus{border-color:var(--caramelo);outline:none;box-shadow:0 0 0 3px rgba(138,82,38,.25)}
.field.error input{border-color:var(--bloq)}
.field .msg{font-size:13px}
.field.error .msg{color:var(--bloq)} .field.okv .msg{color:var(--apto)}
.field.okv input{border-color:var(--apto)}
.check{display:flex;align-items:center;gap:10px;min-height:var(--tactil)}
.check input{width:24px;height:24px;accent-color:var(--caramelo)}
.muted{font-size:13px}
.kpi{border:1px solid var(--arena);border-radius:8px;padding:var(--s3);background:var(--blanco)}
.kpi .v{font-family:var(--f-tit);font-size:26px;font-weight:700}
.kpi .l{font-size:13px}
.progress{height:14px;border-radius:7px;background:var(--crema);border:1px solid var(--arena);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--caramelo);transition:width .3s}
.skel{background:linear-gradient(90deg,var(--crema),#efe4d1,var(--crema));background-size:200% 100%;animation:sk 1.1s infinite;border-radius:4px;height:16px;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
.toast{visibility:hidden;position:fixed;right:20px;bottom:20px;background:var(--tostado);color:#fff;padding:14px 18px;border-radius:8px;max-width:380px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:60;transform:translateY(130%);transition:transform .25s}
.toast.on{transform:none;visibility:visible}
.modal-bg{position:fixed;inset:0;background:rgba(40,20,8,.55);display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal-bg.on{display:flex}
.modal{background:var(--blanco);border-radius:10px;max-width:560px;width:100%;padding:var(--s4);border-top:6px solid var(--caramelo)}
.modal .acts{display:flex;gap:var(--s2);justify-content:flex-end;margin-top:var(--s4);flex-wrap:wrap}

/* Pasos */
.steps{display:flex;list-style:none;padding:0;margin:0 0 var(--s4);gap:4px;flex-wrap:wrap}
.steps li{flex:1 1 120px;min-width:110px}
.steps button{width:100%;min-height:58px;border:none;background:var(--blanco);border-top:5px solid var(--arena);padding:8px;text-align:left;font-family:var(--f-ui);font-size:12px;color:var(--tostado);cursor:pointer}
.steps button b{display:block;font-size:13px}
.steps .done button{border-top-color:var(--apto)}
.steps .cur button{border-top-color:var(--caramelo);background:#F3E9D8}
.steps .exc button{border-top-color:var(--bloq)}
.steps button[disabled]{cursor:not-allowed;opacity:.6}
.flow-actions{display:flex;gap:var(--s2);justify-content:space-between;flex-wrap:wrap;margin-top:var(--s3)}
.status-line{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;margin-bottom:var(--s3)}

/* Datos de demostración */
body.marcar .demo{background:repeating-linear-gradient(45deg,#FFF3C4,#FFF3C4 6px,#FFE89A 6px,#FFE89A 12px);outline:1px dashed #8A5A00;border-radius:3px;padding:0 3px}
body.marcar .demo-box{position:relative;outline:2px dashed #8A5A00;outline-offset:4px}
body.marcar .demo-box:after{content:"DATOS DE DEMOSTRACIÓN";position:absolute;top:-14px;right:8px;background:#8A5A00;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;letter-spacing:.05em}

/* Sistema de diseño */
.swatch{border:1px solid var(--arena);border-radius:8px;overflow:hidden;background:var(--blanco)}
.swatch .c{height:84px}
.swatch .d{padding:10px;font-size:13px}
.icons{display:flex;flex-wrap:wrap;gap:var(--s3)}
.icons figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:96px;font-size:12px;text-align:center}
.spacing div{background:var(--caramelo);height:14px;border-radius:2px}
.row{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}

/* Mapa del sitio */
.tree,.tree ul{list-style:none;margin:0;padding-left:22px}
.tree{padding-left:0}
.tree li{position:relative;padding:4px 0 4px 14px}
.tree ul li:before{content:"";position:absolute;left:-10px;top:0;bottom:0;border-left:2px solid var(--arena)}
.tree ul li:after{content:"";position:absolute;left:-10px;top:18px;width:18px;border-top:2px solid var(--arena)}
.tree ul li:last-child:before{bottom:auto;height:18px}
.node{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--blanco);border:1.5px solid var(--arena);border-radius:6px;padding:5px 10px;font-size:14px}
.node.l0{background:var(--tostado);color:#fff;border-color:var(--tostado);font-family:var(--f-tit);font-size:16px}
.node.l1{border-color:var(--caramelo);font-weight:700}
.node.built{border-color:var(--apto);box-shadow:inset 4px 0 0 var(--apto)}
.node .mod{font-size:11px;font-weight:700;color:var(--caramelo)}
.node.l0 .mod{color:var(--arena)}
.node a{color:inherit}
.legend{display:flex;gap:var(--s3);flex-wrap:wrap;font-size:13px;margin-bottom:var(--s3)}
.legend span{display:inline-flex;gap:6px;align-items:center}

.empty{text-align:center;padding:var(--s6) var(--s4)}
.empty svg{margin-bottom:var(--s3)}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  nav.side{display:none;border-right:none;border-bottom:1px solid var(--arena)}
  nav.side.open{display:block}
  .btn.menu-btn{display:inline-flex}
  main{padding:var(--s3)}
  .g2,.g3,.g5{grid-template-columns:1fr}
  .brand span,.user .who{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.demo-panel{position:fixed;left:16px;bottom:16px;z-index:50;font-size:13px}
.demo-panel>button{min-height:40px;padding:8px 14px;border-radius:999px;border:1.5px solid #8A5A00;background:#FFF3C4;color:#4A2512;font-family:var(--f-ui);font-weight:700;cursor:pointer}
.demo-panel .body{margin-bottom:8px;background:var(--blanco);border:1.5px solid #8A5A00;border-radius:8px;padding:12px;width:300px;max-height:70vh;overflow:auto;box-shadow:0 6px 20px rgba(0,0,0,.15);display:flex;flex-direction:column;gap:6px}
.demo-panel .body[hidden]{display:none}
.demo-panel .body .btn{font-size:13px;min-height:38px;padding:6px 12px}
.demo-panel label{display:flex;gap:8px;align-items:center;min-height:36px;cursor:pointer}
.demo-panel input{width:20px;height:20px;accent-color:var(--caramelo)}
.demo-panel hr{border:none;border-top:1px solid var(--arena);width:100%;margin:4px 0}
[hidden]{display:none!important}
.user-menu{display:flex;align-items:center;gap:12px}
.acc{display:flex;gap:16px;align-items:center;text-decoration:none;color:inherit;margin:0}
.acc:hover{border-color:var(--caramelo)}
.hero{background:var(--tostado);color:#fff;padding:var(--s6) var(--s5)}
.hero h1{font-size:34px;color:#fff}
.hero .lead{color:#F3E9D8}
.hero .card{color:var(--tostado);margin-top:var(--s4)}
.hero-in,.pub-main{max-width:1100px;margin:0 auto}
.pub-main{padding:var(--s5)}
.login{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:var(--s4)}
.login-card{max-width:440px;width:100%}
.wg .full{grid-column:1/-1}
#pub{max-width:none;padding:0}
.btn.ico{min-width:44px;justify-content:center;padding:6px}
/* App de terreno */
#sh-dev{min-height:100vh;background:#2a170b;display:flex;align-items:center;justify-content:center;padding:24px}
.dev-wrap{display:flex;justify-content:center}
.phone{width:390px;height:820px;max-height:calc(100vh - 48px);border:12px solid #120a05;border-radius:40px;background:var(--blanco);display:flex;flex-direction:column;overflow:hidden;font-size:18px;color:var(--tostado)}
.phone.sol{background:#fff;color:#000;filter:contrast(1.15)}
.phone.sol .d-task,.phone.sol .d-opt,.phone.sol .d-btn.sec{border-width:4px;border-color:#000;color:#000}
.d-bar{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--tostado);color:#fff;padding:10px 14px;font-size:14px;font-weight:700}
.d-bar span{display:inline-flex;align-items:center;gap:6px}
.d-sol{min-height:40px;min-width:64px;border-radius:8px;border:2px solid #fff;background:transparent;color:#fff;font-weight:700;font-size:14px}
.d-body{flex:1;overflow:auto}
.d-pad{padding:18px;display:flex;flex-direction:column;gap:14px}
.d-pad h1{font-size:26px;margin:0} .d-pad h2{font-size:22px;margin:0} .d-pad p{margin:0}
.d-note{font-size:15px}
.d-btn{min-height:72px;border-radius:12px;border:3px solid var(--caramelo);background:var(--caramelo);color:#fff;font-size:20px;font-weight:700;font-family:var(--f-ui);display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;padding:10px}
.d-btn.sec{background:#fff;color:var(--tostado);border-color:var(--tostado)}
.d-btn.ok{background:var(--apto);border-color:var(--apto);min-height:96px;font-size:22px}
.d-btn[disabled]{opacity:.4}
.d-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.d-row .d-btn{font-size:16px;flex-direction:column;gap:4px}
.d-task{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-height:110px;padding:14px;border-radius:12px;border:3px solid var(--tostado);background:#fff;color:var(--tostado);font-family:var(--f-ui);font-size:16px;cursor:pointer}
.d-task .d-big{font-size:22px;font-weight:700}
.d-task .d-st{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--caramelo);font-size:18px}
.d-task.hecha{background:#EEF3EA;border-color:var(--apto);cursor:default}
.d-task.hecha .d-st{color:var(--apto)}
.d-steps{display:flex;justify-content:space-between;padding:10px 18px;background:var(--crema);font-weight:700;font-size:16px;border-bottom:2px solid var(--arena)}
.d-dose{display:grid;grid-template-columns:88px 1fr 88px;gap:10px;align-items:center}
.d-dose button{height:88px;border-radius:12px;border:3px solid var(--tostado);background:#fff;font-size:40px;font-weight:700;color:var(--tostado)}
.d-dose output{text-align:center;font-family:var(--f-tit);font-size:40px;font-weight:700}
.d-dose small{display:block;font-family:var(--f-ui);font-size:16px}
.d-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.d-opt{min-height:72px;border-radius:12px;border:3px solid var(--tostado);background:#fff;color:var(--tostado);font-size:15px;font-weight:700;font-family:var(--f-ui);padding:6px}
.d-opt.on{background:var(--tostado);color:#fff}
.d-warn{display:flex;gap:10px;align-items:flex-start;background:#FFF3C4;border-left:6px solid var(--rev);padding:12px;border-radius:8px;font-size:16px;font-weight:700}
.d-sum{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;font-size:18px}
.d-sum dt{font-weight:400} .d-sum dd{margin:0;font-weight:700}
.d-center{text-align:center;align-items:center}
.phone .demo{white-space:nowrap}
.d-center .d-btn{width:100%}
.d-center>svg{color:var(--apto)}
.d-block{display:flex;gap:12px;align-items:center;text-align:left;border:3px solid var(--bloq);color:var(--bloq);border-radius:12px;padding:14px;font-size:17px}
.d-block b{display:block}
.d-item{display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--arena);padding:10px 0}
.d-pin{display:flex;gap:14px;justify-content:center}
.d-pin span{width:48px;height:56px;border:3px solid var(--tostado);border-radius:10px;display:grid;place-items:center;font-size:28px}
.d-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.d-keys button{height:72px;border-radius:12px;border:3px solid var(--tostado);background:#fff;font-size:28px;font-weight:700;color:var(--tostado)}
@media (max-width:600px){#sh-dev{padding:0;display:block}.phone{width:100%;height:100vh;max-height:none;border:none;border-radius:0}.hero{padding:var(--s4) var(--s3)}.pub-main{padding:var(--s3)}}
</style>
</head>
<body class="marcar">

function modal(html,onOk,okTxt='Confirmar',peligro=false){
  const m=$('#modal'),bg=$('#modalBg'),prev=document.activeElement;
  m.innerHTML=html+`<div class="acts"><button class="btn sec" id="mNo">Cancelar</button><button class="btn ${peligro?'peligro':''}" id="mOk">${okTxt}</button></div>`;
  bg.classList.add('on');$('#mOk').focus();
  const close=()=>{bg.classList.remove('on');document.removeEventListener('keydown',esc);prev&&prev.focus()};
  const esc=e=>{if(e.key==='Escape')close()};
  document.addEventListener('keydown',esc);
  $('#mNo').onclick=close;$('#mOk').onclick=()=>{close();onOk&&onOk()};
}

function resetF(){LMR=JSON.parse(JSON.stringify(LMR0));F={paso:0,max:0,ped:null,sel:new Set(),det:'L-2604-017',filtro:'todos',estado:'Pendiente',exc:false,verif:null,reemplazo:null,bitacora:[],t:null};syncPanel()}
function log(t){const d=new Date();F.bitacora.push([d.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),t])}
function ir(p){F.paso=p;F.max=Math.max(F.max,p);render()}
const ped=()=>PEDIDOS.find(p=>p.id===F.ped);
const lote=id=>LOTES.find(l=>l.id===id);
const kgSel=()=>[...F.sel].reduce((s,id)=>s+lote(id).kg,0);
const mercado=id=>MERCADOS.find(m=>m.id===id).n;

function vDestino(){
  const steps=`<ol class="steps" aria-label="Pasos">${PASOS.map((s,i)=>{
    const cls=i<F.paso?'done':i===F.paso?'cur':'';const exc=(i===5&&F.verif==='ret')?' exc':'';
    return `<li class="${cls}${exc}"><button ${i>F.max?'disabled':''} onclick="ir(${i})" ${i===F.paso?'aria-current="step"':''}><b>${i+1}. ${s[0]}</b>${s[1]}</button></li>`}).join('')}</ol>`;
  const p=ped();
  return crumbs([['Inicio','tablero'],['Comercial','comercial'],['Decisión de destino','destino']])+
   `<h1>Decisión de destino</h1>
   <div class="status-line"><span class="chip neu">Estado: ${F.estado}</span>${p?`<span class="chip neu">${D(p.id)} · ${mercado(p.mer)} · ${D(fmt(p.kg)+' kg')}</span>`:''}</div>`+steps+[p0,p1,p2,p3,p4,p5,p6][F.paso]();
}
function nav(prev,next,okNext=true,txt='Continuar'){return `<div class="flow-actions">${prev!==null?`<button class="btn sec" onclick="ir(${prev})">Volver</button>`:'<span></span>'}${next!==null?`<button class="btn" ${okNext?'':'disabled'} onclick="ir(${next})">${txt}</button>`:''}</div>`}

function p0(){
  return `<div class="card"><h2>Pedidos pendientes de asignar destino</h2>
  <p>Seleccione el pedido. Solo se podrán reservar lotes aptos para el mercado del pedido.</p>
  <div class="table-wrap"><table><caption class="sr">Pedidos pendientes</caption><thead><tr><th>Pedido</th><th>Cliente</th><th>Mercado</th><th>Producto</th><th class="num">Kilos</th></tr></thead><tbody>
  ${PEDIDOS.map(x=>`<tr class="${F.ped===x.id?'sel':''}"><td><label class="check"><input type="radio" name="ped" value="${x.id}" ${F.ped===x.id?'checked':''} onchange="F.ped=this.value;F.sel.clear();F.max=0;F.t=null;F.estado='Pendiente';F.verif=null;F.exc=false;F.bitacora=[];render()"> ${D(x.id)}</label></td><td>${D(x.cli)}</td><td>${mercado(x.mer)}</td><td>${D(x.prod)}</td><td class="num">${D(fmt(x.kg))}</td></tr>`).join('')}
  </tbody></table></div></div>`+nav(null,1,!!F.ped,'Ver mercados aptos');
}
function p1(){
  if(!F.t){F.t='calc';setTimeout(()=>{F.t=D('1,2 s');render()},1200)}
  const p=ped();
  if(F.t==='calc')return `<div class="card"><h2>Mercados aptos del inventario</h2><p>Cruzando el inventario disponible con la matriz LMR vigente…</p><div class="skel"></div><div class="skel"></div><div class="skel" style="width:60%"></div></div>`;
  const rows=LOTES.filter(l=>F.filtro==='todos'||aptitud(l,p.mer).s==='ok');
  const aptos=LOTES.filter(l=>aptitud(l,p.mer).s==='ok');
  return `<div class="card"><h2>Mercados aptos del inventario</h2>
  <p>Aptitud de cada lote disponible en los mercados de destino, según la matriz LMR vigente y los resultados analíticos validados.</p>
  <div class="grid g3" style="margin-bottom:var(--s3)">
   <div class="kpi"><div class="v">${D(aptos.length+' de '+LOTES.length)}</div><div class="l">Lotes aptos para ${mercado(p.mer)}</div></div>
   <div class="kpi"><div class="v">${D(fmt(aptos.reduce((s,l)=>s+l.kg,0))+' kg')}</div><div class="l">Disponibles aptos frente a ${D(fmt(p.kg))} kg pedidos</div></div>
   <div class="kpi"><div class="v">${F.t}</div><div class="l">Tiempo de cálculo</div></div>
  </div>
  <p class="muted">${ic('doc',16)} ${matriz()}</p>
  <div class="row" style="margin:var(--s2) 0" role="group" aria-label="Filtro de lotes">
   <button class="btn ${F.filtro==='todos'?'':'sec'}" aria-pressed="${F.filtro==='todos'}" onclick="F.filtro='todos';render()">Todos los lotes</button>
   <button class="btn ${F.filtro==='aptos'?'':'sec'}" aria-pressed="${F.filtro==='aptos'}" onclick="F.filtro='aptos';render()">Solo aptos para ${p.mer}</button></div>
  <div class="table-wrap"><table><caption class="sr">Aptitud por lote y mercado</caption><thead><tr><th>Lote</th><th class="num">Kilos</th>${MERCADOS.map(m=>`<th>${m.n}${m.id===p.mer?' ★':''}</th>`).join('')}<th></th></tr></thead><tbody>
  ${rows.map(l=>`<tr><td><b>${D(l.id)}</b><br><span class="muted">${D(l.org)}</span></td><td class="num">${D(fmt(l.kg))}</td>${MERCADOS.map(m=>`<td>${chip(aptitud(l,m.id))}</td>`).join('')}<td><button class="btn ter" onclick="F.det='${l.id}';ir(2)">Ver detalle</button></td></tr>`).join('')}
  </tbody></table></div></div>`+nav(0,3,true,'Reservar lotes');
}
function p2(){
  const l=lote(F.det);
  return `<div class="card"><h2>Lote ${D(l.id)}</h2>
  <div class="grid g3" style="margin-bottom:var(--s3)"><div class="kpi"><div class="v">${D(fmt(l.kg)+' kg')}</div><div class="l">Saldo disponible</div></div><div class="kpi"><div class="v">${D(l.nef.toFixed(2).replace('.',','))}</div><div class="l">Orígenes efectivos</div></div><div class="kpi"><div class="v" style="font-size:16px">${D(l.org)}</div><div class="l">Composición</div></div></div>
  ${l.deg?`<div class="alert warn">${ic('alerta')}<div><b>Origen degradado</b>Un cuartel llegó sin declaración pre-cosecha. Se aplica el peor escenario de LMR.</div></div>`:''}
  <h3>Residuos frente a límites por mercado</h3>
  <div class="table-wrap"><table><caption class="sr">Residuos frente a LMR por mercado, en mg/kg</caption><thead><tr><th>Principio activo</th><th class="num">Residuo</th>${MERCADOS.map(m=>`<th class="num">LMR ${m.id}</th>`).join('')}</tr></thead><tbody>
  ${PA.map((a,i)=>`<tr><td>${D(a)}</td><td class="num">${D(dec(l.r[i]))}</td>${MERCADOS.map(m=>{const over=l.r[i]!==null&&l.r[i]>LMR[m.id][i];return `<td class="num" style="${over?'color:var(--bloq);font-weight:700':''}">${D(dec(LMR[m.id][i]))}${over?' ✕':''}</td>`}).join('')}</tr>`).join('')}
  </tbody></table></div>
  <p class="muted" style="margin-top:var(--s2)">Valores en mg/kg. n.d.: no detectado. Resultado analítico ${D('LAB-EXT-2604-0391')}, validado por el laboratorio interno.</p>
  <h3>Aptitud resultante</h3>
  <ul>${MERCADOS.map(m=>{const a=aptitud(l,m.id);return `<li style="margin-bottom:6px">${m.n}: ${chip(a)} <span class="muted">${a.why}</span></li>`}).join('')}</ul>
  <a class="btn ter" href="#trazabilidad-y-retiros">Ver árbol de trazabilidad</a>
  </div>`+nav(1,3,true,'Ir a la reserva');
}
function p3(){
  const p=ped(),k=kgSel(),pct=Math.min(100,Math.round(k/p.kg*100));
  return `<div class="card"><h2>Reservar lotes aptos</h2>
  <p>Los lotes no aptos para ${mercado(p.mer)} no se pueden reservar.</p>
  <div style="margin-bottom:var(--s3)"><div class="row" style="justify-content:space-between"><b>Reservado: ${D(fmt(k))} de ${D(fmt(p.kg))} kg</b><span>${pct} %</span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="Avance de la reserva"><i style="width:${pct}%"></i></div></div>
  <div class="table-wrap"><table><caption class="sr">Lotes disponibles para reservar</caption><thead><tr><th>Reservar</th><th class="num">Kilos</th><th>Aptitud ${p.mer}</th><th>Motivo</th></tr></thead><tbody>
  ${LOTES.map(l=>{const a=aptitud(l,p.mer),ok=a.s==='ok';return `<tr class="${F.sel.has(l.id)?'sel':''}"><td><label class="check"><input type="checkbox" ${ok?'':'disabled'} ${F.sel.has(l.id)?'checked':''} onchange="this.checked?F.sel.add('${l.id}'):F.sel.delete('${l.id}');render()" aria-label="Reservar ${l.id}"> ${D(l.id)}</label></td><td class="num">${D(fmt(l.kg))}</td><td>${chip(a)}</td><td class="muted">${ok?'—':a.why}</td></tr>`}).join('')}
  </tbody></table></div>
  ${k>p.kg?`<div class="alert info" style="margin-top:var(--s3)">${ic('alerta')}<div><b>Excedente de ${D(fmt(k-p.kg))} kg</b>El saldo del último lote vuelve al inventario disponible al confirmar.</div></div>`:''}
  ${k<p.kg&&F.sel.size?`<p class="muted" style="margin-top:var(--s2)">Faltan ${D(fmt(p.kg-k))} kg para completar el pedido.</p>`:''}
  </div>`+nav(1,4,k>=p.kg,'Revisar asignación');
}
function p4(){
  const p=ped();
  return `<div class="card"><h2>Confirmar el destino</h2>
  <p>Al confirmar, la instrucción de despacho se envía al Sistema de 2011 con la aptitud verificada.</p>
  <div class="table-wrap"><table><caption class="sr">Resumen de la asignación</caption><thead><tr><th>Lote</th><th class="num">Kilos asignados</th><th>Aptitud ${p.mer}</th></tr></thead><tbody>
  ${(()=>{let rest=p.kg;return [...F.sel].map(id=>{const l=lote(id),a=Math.min(l.kg,rest);rest-=a;return `<tr><td>${D(id)}</td><td class="num">${D(fmt(a))}</td><td>${chip(aptitud(l,p.mer))}</td></tr>`}).join('')})()}
  </tbody></table></div>
  <p class="muted" style="margin-top:var(--s2)">${matriz()}</p>
  ${F.max>4?`<div class="alert ok">${ic('ok')}<div><b>Destino asignado</b>Instrucción ${D('INS-DSP-2027-0088')} enviada al Sistema de 2011.</div></div>`:''}
  </div>
  <div class="flow-actions"><button class="btn sec" onclick="ir(3)">Volver</button>${F.max>4?`<button class="btn" onclick="ir(5)">Ir al control en bodega</button>`:`<button class="btn" onclick="confirmar()">Asignar destino</button>`}</div>`;
}
function confirmar(){
  const p=ped();
  modal(`<h2 id="mTit">Asignar destino ${mercado(p.mer)}</h2><p>Se asignan ${D(fmt(p.kg))} kg de ${F.sel.size} lotes al pedido ${D(p.id)}. La instrucción de despacho se envía al Sistema de 2011.</p><p class="muted">La acción queda registrada en la bitácora.</p>`,
  ()=>{F.estado='Destino asignado';log(`Rosario Alcalde asignó ${mercado(p.mer)} a ${[...F.sel].join(', ')}`);log('Instrucción de despacho enviada al Sistema de 2011');toast('Destino asignado. Instrucción de despacho enviada.');ir(5)},'Asignar destino');
}
function p5(){
  const p=ped();
  let body='';
  if(F.verif==='calc')body=`<div class="skel"></div><div class="skel" style="width:70%"></div><p>Recalculando aptitud con la matriz vigente…</p>`;
  else if(F.verif==='ok')body=`<div class="alert ok">${ic('ok')}<div><b>Verificación favorable</b>Todos los lotes asignados siguen siendo aptos para ${mercado(p.mer)}. Se puede liberar la instrucción y la documentación del embarque.</div></div>`;
  else if(F.verif==='ret')body=retenido();
  else if(F.exc)body=`<div class="alert warn">${ic('alerta')}<div><b>Cambio de LMR publicado · Unión Europea</b>${D('Insecticida I-2: de 0,10 a 0,02 mg/kg')}. La aptitud de los lotes comprometidos se recalcula en la verificación.</div></div>`;
  return `<div class="card"><h2>Control en bodega previo al despacho</h2>
  <p>Antes del despacho se vuelve a calcular la aptitud de cada lote con la matriz vigente. Si un lote dejó de ser apto, la instrucción y la documentación del embarque quedan retenidas.</p>
  <p class="muted">${ic('doc',16)} ${matriz()}</p>
  ${body}
  </div>
  <div class="flow-actions"><button class="btn sec" onclick="ir(4)">Volver</button>${!F.verif?`<button class="btn" onclick="verificar()">${ic('candado',18)} Verificar aptitud</button>`:F.verif==='ok'?`<button class="btn" onclick="cerrar()">Liberar despacho</button>`:''}</div>`;
}
function verificar(){
  const p=ped();F.verif='calc';render();syncPanel();
  setTimeout(()=>{
    if(F.exc&&p.mer==='UE'&&LMR.UE[1]!==.02){LMR.UE[1]=.02;log('Cambio de LMR publicado en la Unión Europea: Insecticida I-2, de 0,10 a 0,02 mg/kg')}
    const malos=[...F.sel].filter(id=>aptitud(lote(id),p.mer).s!=='ok');
    if(malos.length){F.verif='ret';F.estado='Retenido en bodega';log(`Despacho retenido: ${malos.join(', ')} ya no es apto`);calcReemplazo(malos)}
    else{F.verif='ok';F.estado='Verificado';log('Verificación favorable en bodega')}
    render();$('#contenido').focus();
  },1300);
}
function calcReemplazo(malos){
  const p=ped();const quedan=[...F.sel].filter(id=>!malos.includes(id));
  let falta=p.kg-quedan.reduce((s,id)=>s+lote(id).kg,0);
  const cand=LOTES.filter(l=>!F.sel.has(l.id)&&aptitud(l,p.mer).s==='ok');
  const usa=[];for(const c of cand){if(falta<=0)break;usa.push(c.id);falta-=c.kg}
  F.reemplazo={malos,usa,falta:Math.max(0,falta)};
}
function retenido(){
  const p=ped(),R=F.reemplazo;
  const alt=R.malos.map(id=>`${D(id)} sigue apto para ${MERCADOS.filter(m=>aptitud(lote(id),m.id).s==='ok').map(m=>m.n).join(', ')||'ningún mercado'}`).join('; ');
  return `<div class="alert err">${ic('bloq')}<div><b>Despacho retenido</b>${R.malos.map(id=>`${D(id)}: ${aptitud(lote(id),p.mer).why}`).join('<br>')}. La retención se levanta solo con una nueva verificación favorable.</div></div>
  <h3>Reemplazo en inventario</h3>
  ${R.usa.length?`<p>Lote apto disponible: ${R.usa.map(x=>D(x)).join(', ')} (${D(fmt(R.usa.reduce((s,id)=>s+lote(id).kg,0)))} kg).</p>`:'<p>No hay lotes aptos libres en inventario.</p>'}
  ${R.falta>0?`<div class="alert warn">${ic('alerta')}<div><b>Pedido incompleto: faltan ${D(fmt(R.falta))} kg</b>Se notificó a la Gerencia Comercial para gestionar el pedido con el importador.</div></div>`:''}
  <p class="muted">Lote retirado: ${alt}.</p>
  <div class="row"><button class="btn" onclick="aceptarReemplazo()">${R.usa.length?'Aceptar reemplazo y verificar':'Continuar con lo disponible'}</button>
  ${R.falta>0?`<button class="btn sec" onclick="toast('Opciones: despacho parcial acordado con el importador o espera de nuevo producto apto.')">Ver opciones comerciales</button>`:''}</div>`;
}
function aceptarReemplazo(){
  const R=F.reemplazo;R.malos.forEach(id=>F.sel.delete(id));R.usa.forEach(id=>F.sel.add(id));
  log(`Reemplazo aceptado: ${R.usa.join(', ')||'sin reemplazo'}${R.falta>0?`; faltan ${fmt(R.falta)} kg`:''}`);
  F.verif=null;F.estado='En nueva verificación';verificar();
}
function cerrar(){
  modal(`<h2 id="mTit">Liberar el despacho</h2><p>Se liberan la instrucción y la documentación del embarque. El Sistema contable emitirá la factura de exportación.</p>`,
  ()=>{F.estado='Despacho liberado';log('Despacho liberado y registrado en la genealogía del lote');toast('Despacho liberado.');ir(6)},'Liberar despacho');
}
function p6(){
  const p=ped(),k=kgSel();
  return `<div class="card"><h2>Despacho liberado</h2>
  <div class="alert ok">${ic('ok')}<div><b>Pedido ${D(p.id)} despachado</b>${D(fmt(Math.min(k,p.kg)))} kg a ${mercado(p.mer)}, con aptitud verificada al asignar y en bodega.</div></div>
  <h3>Bitácora de la decisión</h3>
  <div class="table-wrap"><table><caption class="sr">Bitácora</caption><thead><tr><th>Hora</th><th>Evento</th></tr></thead><tbody>${F.bitacora.map(b=>`<tr><td>${b[0]}</td><td>${b[1]}</td></tr>`).join('')}</tbody></table></div>
  </div><div class="flow-actions"><a class="btn sec" href="#tablero">Volver al inicio</a><a class="btn" href="#embarques-y-despachos">Ver embarques</a></div>`;
}

 evillagran:{n:'Eduardo Villagrán Salinas',ini:'EV',rol:'Jefatura de Planta',perfil:'planta',saludo:'Eduardo',menu:['tablero','planta','calidad','analitica']},

function renderNav(cur){
  const path=findNav(cur)||[];const out=[];
  NAV.filter(s=>U().menu.includes(s.id)).forEach(s=>{
    out.push(`<a href="#${s.id}" ${cur===s.id?'aria-current="page"':''}>${ic(s.i)}${s.t}</a>`);
    if(path[0]===s&&s.c)s.c.forEach(c=>out.push(`<a href="#${c.id}" style="padding-left:44px;font-size:13px" ${cur===c.id?'aria-current="page"':''}>${c.t}</a>`));
  });
  $('#side').innerHTML=out.join('');
}
function crumbs(list){return `<nav class="crumbs" aria-label="Rastro de navegación"><ol>${list.map((x,i)=>i<list.length-1?`<li><a href="#${x[1]}">${x[0]}</a></li>`:`<li aria-current="page">${x[0]}</li>`).join('')}</ol></nav>`}

function vIngreso(){
  return `<div class="login"><div class="card login-card">
   <img src="${LOGO}" alt="" style="height:72px;display:block;margin:0 auto 8px">

}

function vTablero(){

  <div class="grid g2 wg">${vis.map((c,i)=>{const d=get(c.id);return `<section class="card ${d[3]?'full':''}" style="margin:0">
   <div class="row" style="justify-content:space-between"><h2 style="font-size:18px">${d[1]}</h2>${S.edit?`<div class="row" style="gap:4px"><button class="btn sec ico" ${i===0?'disabled':''} onclick="wg('${c.id}','up')" aria-label="Subir ${d[1]}">↑</button><button class="btn sec ico" ${i===vis.length-1?'disabled':''} onclick="wg('${c.id}','down')" aria-label="Bajar ${d[1]}">↓</button><button class="btn sec ico" onclick="wg('${c.id}','hide')" aria-label="Ocultar ${d[1]}">✕</button></div>`:''}</div>
   ${d[2]()}</section>`}).join('')}</div>`;
}
function wg(id,a){
  const cfg=WG[S.user],k=cfg.findIndex(c=>c.id===id);
  if(a==='hide')cfg[k].on=false;if(a==='show')cfg[k].on=true;
  const vis=cfg.filter(c=>c.on);const j=vis.findIndex(c=>c.id===id);
  if(a==='up'||a==='down'){const o=vis[a==='up'?j-1:j+1];const ko=cfg.indexOf(o);[cfg[k],cfg[ko]]=[cfg[ko],cfg[k]]}
  render();
}

  return `<div class="dev-wrap"><div class="phone ${A.sol?'sol':''}" role="application" aria-label="Aplicación de terreno">${bar}<div class="d-body" id="dBody">${b}</div></div></div>`;
}
function paso(n){return `<div class="d-steps"><span>Paso ${n} de 3</span><span id="dTimer">${A.t0?Math.round((Date.now()-A.t0)/1000)+' s':''}</span></div>`}
function rdev(){$('#devroot').innerHTML=dev();syncPanel()}
function pinK(k){if(k==='←')A.pin=A.pin.slice(0,-1);else if(k==='✓'){if(A.pin.length===4){A.scr='pauta';A.pin=''}else toast('La clave tiene 4 dígitos.')}else if(A.pin.length<4)A.pin+=k;rdev()}
function iniciar(id){A.t=id;A.dosis=PAUTA.find(x=>x.id===id).dosis;A.viento=null;A.motivo=null;A.t0=Date.now();A.scr='r1';rdev()}
function dose(s){const t=PAUTA.find(x=>x.id===A.t);A.dosis=Math.max(0,Math.round((A.dosis+s*0.1)*100)/100);rdev()}
function registrar(){const t=PAUTA.find(x=>x.id===A.t);t.est='hecha';A.ult=Math.round((Date.now()-A.t0)/1000);A.t0=null;A.cola.push({id:'REG-000'+(A.cola.length+2),t:t.id,hora:'10:47'});A.scr='ok';rdev()}
function sincronizar(){A.sync='run';rdev();setTimeout(()=>{const n=A.cola.length;A.cola=[];A.sync=null;rdev();toast(`${n} registros enviados. Los bloqueos de cosecha quedaron visibles en la central.`)},1400)}
setInterval(()=>{const e=document.getElementById('dTimer');if(e&&A.t0)e.textContent=Math.round((Date.now()-A.t0)/1000)+' s'},1000);

/* ================= Panel de demostración ================= */
function syncPanel(){
  const b=$('#dpExc');if(b&&F){const p=ped();b.disabled=!(location.hash==='#destino'&&F.paso>=4&&p&&p.mer==='UE'&&!F.exc&&F.verif!=='ok'&&F.verif!=='ret')}
  const s=$('#dpSig');if(s){s.disabled=location.hash!=='#terreno';s.textContent=A.online?'Perder señal (terreno)':'Recuperar señal (terreno)'}
}
$('#dpBtn').onclick=()=>{const w=$('#dpBody'),o=w.hidden;w.hidden=!o;$('#dpBtn').setAttribute('aria-expanded',o);syncPanel()};
$('#tgDemo').onchange=e=>document.body.classList.toggle('marcar',e.target.checked);
$('#dpExc').onclick=()=>{F.exc=true;toast('Cambio de LMR publicado en la Unión Europea.');syncPanel();render()};
$('#dpSig').onclick=()=>{A.online=!A.online;rdev();if(A.online&&A.cola.length)setTimeout(sincronizar,600)};
$('#dpReset').onclick=()=>{resetF();resetA();WG={};S={user:null,pend:null,intentos:0,edit:false,demoU:null};location.hash='publico';render()};
document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{S.user=null;S.pend=null;S.edit=false;S.demoU=b.dataset.u;if(location.hash==='#ingreso')render();else location.hash='ingreso';toast('Credenciales de '+USERS[b.dataset.u].rol+' cargadas. Presione Ingresar.')});
$('#dpDev').onclick=()=>{location.hash='terreno'};

/* ================= Enrutamiento ================= */
function shell(k){['pub','app','dev'].forEach(x=>$('#sh-'+x).hidden=x!==k);document.body.dataset.shell=k}
function render(){
  const h=(location.hash||'#publico').slice(1);
  if(h==='terreno'){shell('dev');rdev();return}
  if(['publico','ingreso','segundo-factor'].includes(h)){
    shell('pub');const html=h==='publico'?vPublico():h==='ingreso'?vIngreso():vMFA();if(!html)return;$('#pub').innerHTML=html;
    $('#pubBtn').hidden=h!=='publico';
    (h==='publico'?bindPublico:h==='ingreso'?bindIngreso:bindMFA)();syncPanel();return}
  if(!S.user){location.hash='ingreso';return}
  shell('app');
  $('#uName').textContent=U().n;$('#uRol').textContent=U().rol;$('#uIni').textContent=U().ini;
  let html;
  if(h==='tablero')html=vTablero();
  else if(h==='destino'&&U().perfil==='comercial')html=vDestino();
  else{const path=findNav(h);if(!path||!U().menu.includes(path[0].id)){location.hash='tablero';return}html=path.length===1?vSeccion(path[0]):vVacio(path)}
  $('#contenido').innerHTML=html;renderNav(h);syncPanel();
}
let lastHash='';
window.addEventListener('hashchange',()=>{const h=location.hash;if(h!==lastHash){lastHash=h;if(h!=='#destino'){F.t=null}S.edit=false;render();const m=document.querySelector('[data-shell="app"] #contenido');m&&m.focus();$('#side').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false');window.scrollTo(0,0)}});
$('#menuBtn').onclick=()=>{const s=$('#side'),o=s.classList.toggle('open');$('#menuBtn').setAttribute('aria-expanded',o)};
resetF();lastHash=location.hash;render();

</script>
</body>
</html>
